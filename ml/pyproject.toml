[project]
name = "safecontext-ml"
version = "0.1.0"
description = "Safe Context ML: synthetic data, fine-tuning, evaluation and ONNX export"
authors = [
    { name = "Safe Context" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "datasets>=5.1.0",
    "gliner>=0.2.29",
    "mlx-lm>=0.32.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "torch>=2.14.1",
    "transformers>=5.16.1",
]

[project.scripts]
safecontext-ml = "safecontext_ml:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Mac-only for now (Apple Silicon). Widen when Linux/Windows support is needed.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
